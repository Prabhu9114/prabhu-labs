<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Primary Meta Tags -->
  <title>Prabhu Labs</title>
  <meta name="title" content="Prabhu Labs">
  <meta name="description" content="Official project hub and showcase for Prabhu Labs automations, bots, and tools.">

  <!-- Open Graph / Telegram / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.prabhu-labs.in/">
  <meta property="og:title" content="Prabhu Labs">
  <meta property="og:description" content="Official project hub and showcase for Prabhu Labs automations, bots, and tools.">
  <meta property="og:image" content="https://www.prabhu-labs.in/logo.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://www.prabhu-labs.in/">
  <meta property="twitter:title" content="Prabhu Labs">
  <meta property="twitter:description" content="Official project hub and showcase for Prabhu Labs automations, bots, and tools.">
  <meta property="twitter:image" content="https://www.prabhu-labs.in/logo.png">

  <!-- Performance & Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Prabhu Labs",
    "url": "https://www.prabhu-labs.in/"
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #080d1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Profile Header */
    .profile-section {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
      object-fit: cover;
      margin-bottom: 16px;
      aspect-ratio: 1 / 1;
    }

    .title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 6px;
    }

    /* Cards */
    .card {
      width: 100%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
      border-color: rgba(0, 229, 255, 0.4);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(0, 229, 255, 0.1);
      color: #00e5ff;
      border: 1px solid rgba(0, 229, 255, 0.3);
      font-weight: 600;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .card-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* Actions */
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary {
      background: #00e5ff;
      color: #080d1a;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #33ebff;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }

    .btn-outline {
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid #00e5ff;
      color: #00e5ff;
    }

    .btn-outline:hover {
      background: rgba(0, 229, 255, 0.18);
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 85vh;
      background: #0f172a;
      border: 1px solid #00e5ff;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid #1e293b;
      background: #090e1a;
    }

    .modal-header span {
      color: #00e5ff;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close-btn:hover {
      color: #ffffff;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #1e293b;
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- Header Section -->
    <header class="profile-section">
      <img src="logo.png" alt="Prabhu Labs Logo" class="avatar" width="100" height="100" loading="eager" fetchpriority="high">
      <h1 class="title">Prabhu Labs</h1>
      <p class="subtitle">Cloud Solutions, Telegram Automation & System Tools</p>
    </header>

    <!-- OmniPost Bot Card -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title">OmniPost Bot</h2>
        <span class="badge">Automation</span>
      </div>
      <p class="card-desc">
        Automated multi-channel Telegram broadcasting, scheduled feeds, and command-center management tools.
      </p>
      <div class="card-actions">
        <!-- Interactive PDF Trigger Button -->
        <button type="button" class="btn btn-outline" onclick="openPdfModal()">
          📄 View Guide (PDF)
        </button>
      </div>
    </section>
  </main>

  <!-- In-Browser PDF Modal Viewer -->
  <div id="pdfModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <span>OmniPost Bot - User Documentation</span>
        <button type="button" class="modal-close-btn" onclick="closePdfModal()">&times;</button>
      </div>
      <iframe src="/Omnipost-guide.pdf#toolbar=1" class="pdf-frame" title="OmniPost User Guide"></iframe>
    </div>
  </div>

  <script>
    function openPdfModal() {
      document.getElementById('pdfModal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closePdfModal() {
      document.getElementById('pdfModal').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    window.addEventListener('click', function(e) {
      const modal = document.getElementById('pdfModal');
      if (e.target === modal) {
        closePdfModal();
      }
    });

    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closePdfModal();
      }
    });
  </script>
</body>
</html>
